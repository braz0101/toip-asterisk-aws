; ===== TRANSPORT UDP =====
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=<IP_PUBLIQUE>
external_signaling_address=<IP_PUBLIQUE>
local_net=172.31.0.0/16

; ===== MODÈLE COMMUN ENDPOINT =====
; IMPORTANT : pas de use_avpf ni force_avp (bloque la négociation audio)
; rtp_symmetric + rewrite_contact + force_rport = correction NAT obligatoire
[ep-base](!)
type=endpoint
context=internal
disallow=all
allow=ulaw
allow=alaw
allow=g722
allow=gsm
allow=h264
allow=vp8
dtmf_mode=rfc4733
media_encryption=no
direct_media=no
rtp_symmetric=yes
rewrite_contact=yes
force_rport=yes

; ===== MODÈLE COMMUN AUTH =====
[auth-base](!)
type=auth
auth_type=userpass

; ===== MODÈLE COMMUN AOR =====
; IMPORTANT : le nom de l'AOR doit être identique au numéro (1001/1002)
; sinon Asterisk retourne "AOR '' not found"
[aor-base](!)
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

; ===== UTILISATEUR 1001 — MOI =====
[1001](ep-base)
auth=auth1001
aors=1001
callerid="Ibrahima Fall" <1001>

[auth1001](auth-base)
username=1001
password=<MOT_DE_PASSE>

[1001](aor-base)

; ===== UTILISATEUR 1002 — PROF =====
[1002](ep-base)
auth=auth1002
aors=1002
callerid="Mr Mbaye" <1002>

[auth1002](auth-base)
username=1002
password=<MOT_DE_PASSE>

[1002](aor-base)
